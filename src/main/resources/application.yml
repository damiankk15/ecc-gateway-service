api:
  title: "@project.name@"
  description: "@project.description@"
  version: "@project.version@"

  resources:
    jobs: /api/jobs
    job: /api/jobs/{jobId}
    companies: /api/companies
    markets: /api/markets

  cors:
    allowed-origins: []

server:
  port: 8080
  forward-headers-strategy: framework

spring:
  cloud:
    gateway:
      server:
        webflux:
          trusted-proxies: 10\..*
          routes:
            - id: job-api
              uri: ${JOB_SERVICE_URI:http://job-service:8080}
              predicates:
                - Path=/api/jobs/**
              filters:
                - PreserveHostHeader

            - id: company-api
              uri: ${COMPANY_SERVICE_URI:http://company-service:8080}
              predicates:
                - Path=/api/companies/**,/api/markets/**
              filters:
                - PreserveHostHeader

            - id: job-service-docs
              uri: ${JOB_SERVICE_URI:http://job-service:8080}
              predicates:
                - Path=/jobs/v3/api-docs
              filters:
                - RewritePath=/jobs/v3/api-docs, /v3/api-docs

            - id: company-service-docs
              uri: ${COMPANY_SERVICE_URI:http://company-service:8080}
              predicates:
                - Path=/companies/v3/api-docs
              filters:
                - RewritePath=/companies/v3/api-docs, /v3/api-docs

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/ecc-realm/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://keycloak.local/realms/ecc-realm}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls:
      - name: Gateway API
        url: /v3/api-docs
      - name: Company API
        url: /companies/v3/api-docs
      - name: Job API
        url: /jobs/v3/api-docs
    urls-primary-name: Gateway API
