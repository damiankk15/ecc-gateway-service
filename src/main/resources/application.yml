api:
  title: '@project.name@'
  description: '@project.description@'
  version: '@project.version@'

  endpoints:
    signup: /api/auth/actions/signup

server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-api
              uri: http://auth-service:8080
              predicates:
                - Path=/api/auth/**

            - id: auth-service-docs
              uri: http://auth-service:8080
              predicates:
                - Path=/auth/v3/api-docs
              filters:
                - RewritePath=/auth/v3/api-docs, /v3/api-docs

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/ecc-realm

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls:
      - name: Gateway API
        url: /v3/api-docs
      - name: Auth API
        url: /auth/v3/api-docs
    urls-primary-name: Gateway API
